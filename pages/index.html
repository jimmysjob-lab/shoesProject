<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鞋子電商</title>
  </head>
  <body>
    <%-include("./layout/header") -%>

    <article class="banner-bg">
      <h2 class="display-1 display-2-md text-neutral-0 mb-4 mb-md-2">
        URBNSTEP
      </h2>
      <h3 class="heading-h3 h5-md text-neutral-0 mb-12 mb-md-8">
        Your Step, Your Statement
      </h3>
      <button
        type="button"
        class="text-neutral-900 bg-primary-300 border-sm py-3 px-6"
      >
        立即選購
      </button>
    </article>

    <main class="container">
      <section class="py-16 py-md-10">
        <div class="text-center mb-8 mb-md-6">
          <h2 class="display-2 h2-md mb-3">New Arrival</h2>
          <h2 class="heading-h2 h4-md">新品上市</h2>
        </div>
        <div class="row">
          <div class="col-6 col-md-2 mb-10 mb-md-6">
            <img
              src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/new-1.png?raw=true"
              alt="new1"
              class="mb-3 mb-md-2"
            />
            <h5 class="heading-h5 h6-md mb-1 m-md-0">Monoverse</h5>
            <p class="label-md">NT$3,600</p>
          </div>
          <div class="col-6 col-md-2 mb-10 mb-md-6">
            <img
              src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/new-2.png?raw=true"
              alt="new2"
              class="mb-3 mb-md-2"
            />
            <h5 class="heading-h5 h6-md mb-1 m-md-0">PLATFORM 404</h5>
            <p class="label-md">NT$2,600</p>
          </div>
          <div class="col-6 col-md-2">
            <img
              src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/new-3.png?raw=true"
              alt="new3"
              class="mb-3 mb-md-2"
            />
            <h5 class="heading-h5 h6-md mb-1 m-md-0">URBN Force</h5>
            <p class="label-md">NT$3,200</p>
          </div>
          <div class="col-6 col-md-2">
            <img
              src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/new-4.png?raw=true"
              alt="new4"
              class="mb-3 mb-md-2"
            />
            <h5 class="heading-h5 h6-md mb-1 m-md-0">Mode90</h5>
            <p class="label-md">NT$4,000</p>
          </div>
        </div>
      </section>
      <section class="py-16 py-md-10">
        <h2 class="heading-h2 h4-md mb-4">熱銷補貨</h2>
        <div class="row">
          <div class="col-3 col-md-4">
            <div class="position-relative">
              <span
                class="popular-position d-inline-block bg-primary-100 text-primary-400 label-md py-2 px-3"
                >人氣 No.1</span
              >
              <img
                src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product-3.png?raw=true"
                alt=""
              />
            </div>
          </div>
          <div class="col-3 col-md-4">
            <div class="position-relative">
              <span
                class="popular-position d-inline-block bg-primary-100 text-primary-400 label-md py-2 px-3"
                >人氣 No.1</span
              >
              <img
                src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product.png?raw=true"
                alt=""
              />
            </div>
          </div>
          <div class="col-3 col-md-4">
            <div class="position-relative">
              <span
                class="popular-position d-inline-block bg-primary-100 text-primary-400 label-md py-2 px-3"
                >人氣 No.1</span
              >
              <img
                src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product-6.png?raw=true"
                alt=""
              />
            </div>
          </div>
          <div class="col-3 col-md-4">
            <div class="position-relative">
              <span
                class="popular-position d-inline-block bg-primary-100 text-primary-400 label-md py-2 px-3"
                >人氣 No.1</span
              >
              <img
                src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week2/product-4.png?raw=true"
                alt=""
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <%-include("./layout/footer") -%>
    <script type="module" src="../main.js"></script>
  </body>
</html>
